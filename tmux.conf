# https://github.com/adambiggs/dotfiles/blob/master/tmux.conf


set -g base-index 1
set -g pane-base-index 1

bind | split-window -h
bind - split-window -v

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

bind N new-window

# True color + undercurl passthrough: LazyVim needs both.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# nvim :checkhealth recommendations
set -sg escape-time 10
set -g focus-events on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g history-limit 20000

setw -g mouse on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# 'v' begins selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection

# 'y' copies to the system clipboard; later lines win, so the most specific
# tool for the platform ends up bound (WSL: clip.exe over xclip).
if-shell 'command -v xclip'    "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe 'xclip -selection clipboard'"
if-shell 'command -v wl-copy'  "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe 'wl-copy'"
if-shell 'command -v clip.exe' "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe 'clip.exe'"
if-shell 'command -v pbcopy'   "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe 'pbcopy'"

bind-key -T root PPage if-shell -F "#{alternate_on}" "send-keys PPage" "copy-mode -e; send-keys PPage"

bind -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "select-pane -t =; send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "select-pane -t =; send-keys -M" "select-pane -t =; send-keys -M"
